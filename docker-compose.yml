services:
  postgres:
    image: postgres:16
    container_name: residencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: residencia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
